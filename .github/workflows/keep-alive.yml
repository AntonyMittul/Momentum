name: Keep Render Backend Awake

on:
  schedule:
    # Run every 10 minutes to prevent Render's 15-minute inactivity sleep
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend API
        run: |
          curl -m 30 -s "https://momentum-aj3j.onrender.com/api/tasks/" > /dev/null || true
          echo "Pinged backend to keep it awake!"
