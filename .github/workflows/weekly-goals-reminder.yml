name: Bi-Daily Goals Reminder

on:
  schedule:
    # Runs at 6:00 PM IST on Tuesdays and Thursdays (UTC: 12:30 on 2,4)
    - cron: '30 12 * * 2,4'
  workflow_dispatch:

jobs:
  remind-goals:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Weekly Goals Reminder
        run: |
          curl -X POST "https://momentum-aj3j.onrender.com/api/cron/weekly-goals-reminder" \
          -H "x-cron-secret: ${{ secrets.CRON_SECRET_KEY }}" \
          -m 30 -s > /dev/null || true
          echo "Triggered bi-daily goals reminder!"
