name: Daily Inactivity Reminder

on:
  schedule:
    # Runs at 12:00 PM, 6:00 PM, and 9:00 PM IST (UTC: 06:30, 12:30, 15:30)
    - cron: '30 6,12,15 * * *'
  workflow_dispatch:

jobs:
  check-inactivity:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Daily Inactivity Check
        run: |
          curl -X POST "https://momentum-aj3j.onrender.com/api/cron/inactivity-check" \
          -H "x-cron-secret: ${{ secrets.CRON_SECRET_KEY }}" \
          -m 30 -s > /dev/null || true
          echo "Triggered daily inactivity check!"
