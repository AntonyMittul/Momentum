name: Daily Inactivity Reminder

on:
  schedule:
    # Runs at 12:00 PM, 6:00 PM, and 9:00 PM IST (UTC: 06:30, 12:30, 15:30)
    - cron: '30 6,12,15 * * *'
  workflow_dispatch:

jobs:
  check-inactivity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger Daily Inactivity Check
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          RESPONSE=$(curl -v -X POST "https://momentum-aj3j.onrender.com/api/cron/inactivity-check" \
          -H "x-cron-secret: ${{ secrets.CRON_SECRET_KEY }}" \
          -m 120 -s)
          echo "Raw response:"
          echo "$RESPONSE"
          python .github/scripts/send_email.py "$RESPONSE"
