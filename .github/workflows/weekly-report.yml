name: Weekly Automated Report

on:
  schedule:
    # Runs at 8:00 PM IST every Saturday (UTC: 14:30 on Saturday)
    - cron: '30 14 * * 6'
  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger Weekly Report Generation
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          RESPONSE=$(curl -X POST "https://momentum-aj3j.onrender.com/api/cron/weekly-report" \
          -H "x-cron-secret: ${{ secrets.CRON_SECRET_KEY }}" \
          -m 120 -s)
          echo "Triggered weekly automated report! Response received."
          python .github/scripts/send_email.py "$RESPONSE"
